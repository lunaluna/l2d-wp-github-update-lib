# 外部 Actions を SHA で固定したため、新しい版への追従は Dependabot に任せる.
# 対象は .github/workflows/ の uses: の外部 Actions(ci.yml / release.yml / plugin-release.yml).
# directory "/" は /.github/workflows とルートの action.yml を探す(公式ドキュメントで確認).
# 自リポジトリの composite action(.github/actions/*)は外部 Actions を使っていないので対象外.
# 行末の "# vX.Y.Z" コメントを Dependabot が更新するかは未確認. 最初の PR で確認すること.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
