name: Plugin release

# 単純な構成の利用側プラグイン(FAUC / get-patterns-by-pattern-name /
# flamingo-csv-sjis-exporter)が workflow_call で呼ぶ reusable workflow。
# WPMAR のような複雑な release.yml(フォント生成・vendor-pdf.zip 同梱等)
# を持つリポジトリは、これを使わず composite actions のみを個別に使う。
#
# 呼び出し元は push(タグ)または workflow_dispatch(inputs.tag)で
# トリガーする想定。github コンテキストは caller のものになるため、
# github.event_name / github.event.inputs.tag は caller 側の値を参照する
# (Step A0 で実機確認済み).

on:
  workflow_call:
    inputs:
      slug:
        description: 'プラグインスラッグ(プラグインディレクトリ名・メインファイル名の元).'
        required: true
        type: string
      version_files:
        description: 'verify-version action に渡す "path:pattern" の複数行.'
        required: true
        type: string
      notes_source:
        description: 'release-notes action に渡す抽出元ファイル(readme.txt など).'
        required: true
        type: string
      php_version:
        description: '非空なら setup-php を実行する PHP バージョン(例 8.2). composer で vendor/ を作る利用側向け.'
        required: false
        type: string
        default: ''
      extra_assets:
        description: >-
          本体 ZIP に加えて Release へ添付するファイルの複数行リスト。
          "path" または "path#label"(gh release create の記法). 空なら何も追加しない.
        required: false
        type: string
        default: ''
      draft:
        description: 'true なら draft として作成する. 検証後に `gh release edit <tag> --draft=false` で本公開する.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::タグを解決できませんでした(workflow_dispatch では tag 入力が必須です)"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        uses: lunaluna/l2d-wp-github-update-lib/.github/actions/verify-version@1.1.0
        with:
          version: ${{ steps.resolve.outputs.version }}
          files: ${{ inputs.version_files }}

      - name: Set up PHP
        if: inputs.php_version != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:v2

      - name: Run release pre-build hook
        run: |
          # 利用側が bin/release.pre.sh を置いていれば、配布 ZIP を組み立てる前に
          # 実行する。ZIP に同梱する生成物や、extra_assets で添付する追加ファイルを
          # ここで作る(WPMAR のフォント生成・vendor-pdf.zip など)。
          # bash で明示的に起動するため実行権限は不要(-f で判定する)。
          if [ -f bin/release.pre.sh ]; then
            echo "Running bin/release.pre.sh ..."
            bash bin/release.pre.sh
          fi

      - name: Build distribution ZIP
        id: build
        uses: lunaluna/l2d-wp-github-update-lib/.github/actions/build-zip@1.1.0

      - name: Extract release notes
        id: notes
        uses: lunaluna/l2d-wp-github-update-lib/.github/actions/release-notes@1.1.0
        with:
          source: ${{ inputs.notes_source }}
          version: ${{ steps.resolve.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          EXTRA_ASSETS: ${{ inputs.extra_assets }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # gh release create <tag> [<files>...] [flags] の順に組み立てる.
          ARGS=( "$TAG" "$ZIP_NAME" )

          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            # "path#label" 記法の label 側を落としてから存在確認する.
            if [ ! -f "${asset%%#*}" ]; then
              echo "::error::extra_assets に指定された ${asset%%#*} が見つかりません."
              exit 1
            fi
            ARGS+=( "$asset" )
          done <<< "$EXTRA_ASSETS"

          ARGS+=( --title "$TAG" --notes-file "$NOTES_FILE" )

          if [ "$DRAFT" = "true" ]; then
            ARGS+=( --draft )
          fi

          gh release create "${ARGS[@]}"

          if [ "$DRAFT" = "true" ]; then
            echo "::notice::Draft release created. Verify assets, then run: gh release edit ${TAG} --draft=false"
          fi
