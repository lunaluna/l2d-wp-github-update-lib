name: Release

# dist/loader.php の l2dwpghul_updater_register() 呼び出しに埋め込まれた
# 自己申告バージョン文字列(例 '1.0.2')は、複数プラグインが異なる版の
# このライブラリを同梱していても最新版だけが起動する、というバージョン
# 交渉ロジックの判定基準そのもの(dist/loader.php 参照)。この文字列は各
# リリースで手動編集されており、タグ付け時にそれを検証する仕組みが
# これまで無かった(このリポジトリ自身にタグ push で動く release.yml が
# 存在しないため)。更新を忘れると、古いライブラリコードが新しいコードより
# 「新しい」と誤認識され、静かに勝ち続ける実害につながる。
#
# バージョン検証を通ったタグに限り、dist/ の内容だけを取り出した配布専用の
# 履歴(dist ブランチ・dist-X.Y.Z タグ)を publish-dist job で自動生成する。
# 利用側プラグインはこの dist タグを subtree pull の参照先にすることで、
# 開発用ファイル(tests/・.github/・composer.* 等)を取り込まずに済む。

on:
  push:
    tags:
      - '[0-9]*' # 1.1.0 以降は v なし。既存の v1.0.x タグは再 push しない

permissions:
  contents: read

jobs:
  verify-loader-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dist/loader.php's self-reported version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          LOADER_VERSION=$(grep -E "l2dwpghul_updater_register\( '" dist/loader.php \
            | head -n1 | sed -E "s/^[^']*'([^']+)'.*/\1/")

          echo "Tag:                              $TAG"
          echo "dist/loader.php self-reported version: $LOADER_VERSION"

          if [ "$LOADER_VERSION" != "$VERSION" ]; then
            echo "::error::dist/loader.php の自己申告バージョン ($LOADER_VERSION) がタグ ($VERSION) と一致しません。l2dwpghul_updater_register() の第一引数を更新してください。"
            exit 1
          fi

  publish-dist:
    needs: verify-loader-version
    runs-on: ubuntu-latest
    permissions:
      contents: write # dist ブランチ / dist タグの push に必要
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # subtree split は全履歴が必要

      - name: Publish dist branch and tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # git subtree split は commit-tree でコミットを生成するため、
          # committer の identity が必要(未設定だと失敗する).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git subtree split --prefix=dist -b dist-tmp
          git push origin dist-tmp:dist --force
          git tag "dist-${TAG}" dist-tmp
          git push origin "dist-${TAG}"
